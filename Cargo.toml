[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/render",
    "crates/ui",
    "crates/app",
    "bins/game",
    "bins/sim",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
vivarium-core = { path = "crates/core" }
vivarium-render = { path = "crates/render" }
vivarium-ui = { path = "crates/ui" }
vivarium-app = { path = "crates/app" }

# 图形依赖只在 render 与 bins/game 里出现。
# bins/sim 刻意不引入它们——见 README「两条架构约束」。
wgpu = "30.0"
winit = "0.30"
pollster = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }

# 界面。三个 crate 必须锁在同一个 minor 上：egui-wgpu 0.37 依赖 wgpu 30，
# egui-winit 0.37 依赖 winit 0.30.13——正好是本项目已经用的那两个大版本。
# 错一个小版本就得在依赖图里塞两份 wgpu，而两份 wgpu 的 device 类型不通用，
# egui 根本拿不到渲染器的 device。
egui = "0.37"
egui-wgpu = "0.37"
egui-winit = "0.37"

# 发布构建：模拟内核要跑得快，但调试信息保留到 line-tables-only，
# 这样 release 下依然能拿到可读的 panic 栈。
[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# 开发构建：模拟内核在 debug 下会慢一个数量级，
# 所以给依赖开 opt-level 3，自己的 crate 保持 O0 以便快速编译与调试。
[profile.dev.package."*"]
opt-level = 3
