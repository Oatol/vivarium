[package]
name = "vivarium-game"
description = "Vivarium 图形前端"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "vivarium-game"
path = "src/main.rs"

[dependencies]
vivarium-core.workspace = true
vivarium-render.workspace = true
vivarium-ui.workspace = true
vivarium-app.workspace = true

# 窗口与事件循环只属于应用层。
# vivarium-render 不依赖 winit——它只接受一个已经建好的 wgpu::Surface，
# 这样"能不能开窗口"和"怎么把世界画成像素"是两件可以分别替换的事。
winit.workspace = true
wgpu.workspace = true
pollster.workspace = true
